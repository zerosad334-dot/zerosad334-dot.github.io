<!DOCTYPE html>
<html>
<head>
<title>Neural Interface</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: monospace;
    background: black;
    color: #00ff55;
    text-align: center;
    overflow: hidden;
    user-select: none;
    touch-action: none; /* Helps prevent some swipe gestures */
}

canvas {
    position: fixed;
    top: 0;
    left: 0;
    z-index: -1;
}

.box {
    margin-top: 120px;
}

.panel {
    display: inline-block;
    background: rgba(0,0,0,0.9);
    padding: 25px;
    border: 1px solid #00ff55;
    border-radius: 10px;
    min-width: 320px;
    box-shadow: 0 0 20px #00ff55;
}

.start-btn {
    padding: 15px 30px;
    background: transparent;
    color: #00ff55;
    border: 1px solid #00ff55;
    font-weight: bold;
    cursor: pointer;
    font-family: monospace;
    text-transform: uppercase;
}

.exit-btn {
    margin-top: 20px;
    background: #00ff55;
    color: black;
    border: none;
    padding: 12px 24px;
    font-weight: bold;
    font-size: 1.1em;
    cursor: pointer;
    border-radius: 5px;
}

@keyframes shake {
    0% { transform: translate(0px, 0px); }
    25% { transform: translate(2px, -2px); }
    50% { transform: translate(-2px, 2px); }
    75% { transform: translate(2px, 2px); }
    100% { transform: translate(0px, 0px); }
}

.shake {
    animation: shake 0.1s infinite;
}
</style>
</head>

<body>

<canvas id="matrix"></canvas>

<div class="box">
    <div class="panel" id="panel">
        <h2>NEURAL INTERFACE ACTIVE</h2>
        <p>Biometric Authentication Required</p>
        <button class="start-btn" onclick="start()">START SCAN</button>
    </div>
</div>

<script>
/* --- HARD LOCK LOGIC --- */
let isLocked = true;

function activateHardLock() {
    // Fill the history stack immediately upon interaction
    for (let i = 0; i < 20; i++) {
        history.pushState({lock: true}, null, location.href);
    }

    // Capture the back/swipe attempt
    window.onpopstate = function (event) {
        if (isLocked) {
            // Push back into the page
            history.pushState({lock: true}, null, location.href);
            
            // Haptic feedback (Samsung/Android specific)
            if (navigator.vibrate) navigator.vibrate([50, 50, 50]);
            
            // The "Hard Lock" alert - breaks the swipe momentum
            alert("CRITICAL ERROR: Neural Override Active. Access Denied.");
        }
    };

    // The Browser Guard (Confirmation popup)
    window.onbeforeunload = function (e) {
        if (isLocked) {
            const msg = "Neural Sync in progress. Disconnection will result in data loss.";
            (e || window.event).returnValue = msg;
            return msg;
        }
    };
}

function exitPrank() {
    isLocked = false; 
    // Redirect to a safe page
    window.location.replace("https://www.google.com");
}

/* --- MATRIX EFFECT --- */
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let letters = "01NEURALMATRIXSYSTEM".split("");
let fontSize = 14;
let columns = canvas.width / fontSize;
let drops = Array(Math.floor(columns)).fill(1);

function draw() {
    ctx.fillStyle = "rgba(0,0,0,0.05)";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = "#00ff55";
    ctx.font = fontSize + "px monospace";
    for (let i = 0; i < drops.length; i++) {
        let text = letters[Math.floor(Math.random()*letters.length)];
        ctx.fillText(text, i*fontSize, drops[i]*fontSize);
        if (drops[i]*fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
    }
}
setInterval(draw, 33);

/* --- PRANK FLOW --- */
function start() {
    // TRIGGER THE HARD LOCK
    activateHardLock();

    const panel = document.getElementById("panel");
    panel.innerHTML = `<h2>Scanning user...</h2>`;

    setTimeout(() => { panel.innerHTML = `<h2>Analyzing neural data...</h2>`; }, 2000);
    
    setTimeout(() => {
        panel.innerHTML = `<h2>⚠️ System instability detected</h2>`;
        document.body.classList.add("shake");
        if (navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 300]);
    }, 4000);
    
    setTimeout(() => { panel.innerHTML = `<h2>Rebooting system...</h2>`; }, 6500);
    setTimeout(() => { panel.innerHTML = `<h2>Session terminated</h2>`; }, 8500);

    setTimeout(() => {
        document.body.classList.remove("shake");
        panel.innerHTML = `
            <h1>😂 GOT YOU</h1>
            <p>Relax Sharleen… just a prank</p>
            <button class="exit-btn" onclick="exitPrank()">EXIT SYSTEM</button>
        `;
    }, 10500);
}
</script>

</body>
</html>
